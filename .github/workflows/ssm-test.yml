
name: AWS SSM Deployment Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-ssm:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send test command to EC2
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-001e936cdfb386054 \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["echo Hello from GitHub Actions through AWS SSM","hostname"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for command execution
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.COMMAND_ID }}" \
            --instance-id i-001e936cdfb386054

      - name: Display execution result
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.COMMAND_ID }}" \
            --instance-id i-001e936cdfb386054 \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
