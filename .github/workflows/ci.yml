
name: Continuous Integration

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CURRENT_API_KEY: ${{ secrets.CURRENT_API_KEY }}
      PREVIOUS_API_KEY: ${{ secrets.PREVIOUS_API_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Test Dependencies
        run: python -m pip install pytest

      - name: Run Automated Tests
        run: python -m pytest -q

      - name: Verify FastAPI Application
        run: python -c "from main import app; print('FastAPI application imported successfully')"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push API Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            rajnishk2439/ai-trading-api:latest
            rajnishk2439/ai-trading-api:${{ github.sha }}
