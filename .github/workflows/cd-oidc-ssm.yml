name: Continuous Deployment - OIDC S3 SSM

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
    branches:
      - master

# Prevent overlapping production deployments.
concurrency:
  group: ai-trading-production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')

    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
      S3_BUCKET: ai-trading-deployment-artifacts-109389764805
      EC2_INSTANCE_ID: i-001e936cdfb386054
      DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # 1. Check out the exact commit that CI built.
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # 2. Validate the deployment inputs before uploading anything.
      - name: Validate deployment artifacts
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "$DEPLOYMENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid deployment commit SHA."
            exit 1
          fi

          test -s docker-compose.prod.yml
          test -s scripts/deploy-production.sh

          bash -n scripts/deploy-production.sh

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [[ "$CHECKED_OUT_SHA" != "$DEPLOYMENT_SHA" ]]; then
            echo "ERROR: Checked-out commit does not match deployment SHA."
            exit 1
          fi

          echo "Deployment commit: $CHECKED_OUT_SHA"
          echo "Deployment artifacts exist and passed syntax validation."

      # 3. Authenticate to AWS using GitHub OIDC.
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -Eeuo pipefail
          aws sts get-caller-identity

      # 4. Upload only the two deployment artifacts to this commit's S3 prefix.
      - name: Upload deployment artifacts to S3
        shell: bash
        run: |
          set -Eeuo pipefail

          ARTIFACT_PREFIX="s3://${S3_BUCKET}/deployments/${DEPLOYMENT_SHA}"

          aws s3 cp \
            docker-compose.prod.yml \
            "${ARTIFACT_PREFIX}/docker-compose.prod.yml" \
            --only-show-errors

          aws s3 cp \
            scripts/deploy-production.sh \
            "${ARTIFACT_PREFIX}/deploy-production.sh" \
            --only-show-errors

          echo "Uploaded deployment artifacts to ${ARTIFACT_PREFIX}"

      # 5. Start deployment through SSM and wait for its actual result.
      - name: Deploy on EC2 through Systems Manager
        shell: bash
        run: |
          set -Eeuo pipefail

          SSM_SCRIPT="$(cat <<EOF
          set -eu

          DEPLOYMENT_SHA="${DEPLOYMENT_SHA}"
          S3_BUCKET="${S3_BUCKET}"
          ARTIFACT_DIR="/home/ubuntu/deployment-artifacts/\${DEPLOYMENT_SHA}"
          SCRIPT_PATH="\${ARTIFACT_DIR}/deploy-production.sh"

          echo "Preparing deployment script for commit \${DEPLOYMENT_SHA}"

          install -d -o ubuntu -g ubuntu -m 0750 "\${ARTIFACT_DIR}"

          sudo -u ubuntu -H aws s3 cp \
            "s3://\${S3_BUCKET}/deployments/\${DEPLOYMENT_SHA}/deploy-production.sh" \
            "\${SCRIPT_PATH}" \
            --only-show-errors

          chown ubuntu:ubuntu "\${SCRIPT_PATH}"
          chmod 700 "\${SCRIPT_PATH}"

          echo "Executing deployment as ubuntu..."
          sudo -u ubuntu -H bash "\${SCRIPT_PATH}" "\${DEPLOYMENT_SHA}" "\${S3_BUCKET}"
          EOF
          )"

          PARAMETERS="$(jq -cn \
            --arg commands "$SSM_SCRIPT" \
            '{commands: [$commands], executionTimeout: ["2700"]}')"

          COMMAND_ID="$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "AI Trading Research Agent deployment ${DEPLOYMENT_SHA}" \
            --timeout-seconds 600 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "ERROR: SSM did not return a command ID."
            exit 1
          fi

          echo "SSM command ID: $COMMAND_ID"
          echo "Waiting for deployment to finish..."

          FINAL_STATUS=""

          # Poll for up to 45 minutes. This is longer than the 5-minute
          # application health-check window in the deployment script.
          for attempt in $(seq 1 540); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$STATUS" in
              Success)
                FINAL_STATUS="Success"
                break
                ;;
              Failed|TimedOut|Cancelled|Cancelling|Undeliverable|Terminated|DeliveryTimedOut|ExecutionTimedOut)
                FINAL_STATUS="$STATUS"
                break
                ;;
              Pending|InProgress|Delayed|"")
                if (( attempt % 12 == 0 )); then
                  echo "SSM status: ${STATUS:-Not yet available} (${attempt}/540)"
                fi
                sleep 5
                ;;
              *)
                echo "SSM returned status: $STATUS"
                sleep 5
                ;;
            esac
          done

          if [[ -z "$FINAL_STATUS" ]]; then
            echo "ERROR: Timed out waiting for SSM deployment result."
            exit 1
          fi

          echo "======================================"
          echo "SSM deployment status: $FINAL_STATUS"
          echo "======================================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          if [[ "$FINAL_STATUS" != "Success" ]]; then
            echo "ERROR: EC2 deployment did not complete successfully."
            exit 1
          fi

          echo "Deployment completed successfully."
