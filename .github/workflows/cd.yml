name: Continuous Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            rajnishk2439/ai-trading-api:latest
            rajnishk2439/ai-trading-api:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull rajnishk2439/ai-trading-api:latest

            docker stop trading-api || true

            docker rm trading-api || true

            docker run -d \
              --name trading-api \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file /home/ubuntu/ai-trading-research-agent/.env \
              rajnishk2439/ai-trading-api:latest
            
            echo "Waiting for application to become healthy..."

            for i in {1..30}; do
              if curl --fail http://localhost:8000/health; then
                echo "Application is healthy."
                exit 0
              fi
            
              echo "Waiting... ($i/30)"
              sleep 5
            done
            
            echo "Health check failed after waiting."
            docker logs trading-api
            exit 1