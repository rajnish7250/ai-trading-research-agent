services:
  trading-api:
    build:
      context: .
      dockerfile: Dockerfile.api

    image: ai-trading-api
    container_name: trading-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./chroma_db:/app/chroma_db
      - ./research_history.db:/app/research_history.db

    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  trading-frontend:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-trading-frontend:local
    container_name: trading-frontend

    environment:
      API_BASE_URL: http://trading-api:8000

    ports:
      - "127.0.0.1:8501:8501"

    depends_on:
      - trading-api

    restart: unless-stopped
