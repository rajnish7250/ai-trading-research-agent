services:
  trading-api:
    build:
      context: .
      dockerfile: Dockerfile.api

    image: ai-trading-api
    container_name: trading-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./chroma_db:/app/chroma_db
      - ./research_history.db:/app/research_history.db

    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
