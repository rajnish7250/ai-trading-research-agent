services:
  trading-api:
    build:
      context: .
      dockerfile: Dockerfile.api

    image: ai-trading-api
    container_name: trading-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./chroma_db:/app/chroma_db
      - ./research_history.db:/app/research_history.db

    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
